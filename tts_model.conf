#   gemini-31 -> gemini-3.1-flash-tts-preview  ($20/M audio, ~1.1฿/min)
# Switch: sh select-tts-model.sh gemini-25 | gemini-31
# Female-THAI only voices (Peach 3/9): Sulafat (Warm) main, Kore secondary.

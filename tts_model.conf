# --- fish voice-design knobs (5/9 audit) — defaults below, override to taste ---
# FISH_TEMPERATURE=0.4        # low = deterministic/clear (fish default 0.7)
# FISH_TOP_P=0.7
# FISH_REPETITION_PENALTY=1.3 # >1.0 stops syllable loops
# FISH_SPEED=0.95             # 0.5-2.0; <1.0 = unhurried = clearer
# FISH_CHUNK_LENGTH=300       # 100-300
# FISH_NORMALIZE_TH=1         # Thai read-aloud normalizer (numbers/฿/phones)
# FISH_QUALITY_GUARD=0        # 1 = send features:["quality-guard"]